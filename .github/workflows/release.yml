name: Release & Deploy to MinIO

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-deploy:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            target: 'universal-apple-darwin'
            arch: 'macos'
          - platform: 'windows-latest'
            target: 'x86_64-pc-windows-msvc'
            arch: 'windows'

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install system dependencies (Windows)
        if: matrix.platform == 'windows-latest'
        run: |
          # WiX or NSIS if needed

      - name: Install npm dependencies
        run: npm ci

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: v__VERSION__
          releaseName: 'Cekcok Super App v__VERSION__'
          releaseBody: 'See release notes.'
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}

      - name: Setup MinIO Client (mc)
        uses: minio/setup-minio@v2
        with:
          minio-endpoint: https://releases.cekcok.my.id
          minio-access-key: ${{ secrets.MINIO_ACCESS_KEY || 'minioadmin' }}
          minio-secret-key: ${{ secrets.MINIO_SECRET_KEY || 'minioadmin' }}

      - name: Deploy Artifacts to MinIO
        shell: bash
        run: |
          echo "Deploying ${{ matrix.platform }} build artifacts to MinIO..."
          
          # Upload bundle artifacts to MinIO
          mc mb --ignore-existing minio/cekcok-releases
          mc anonymous set download minio/cekcok-releases

          if [ "${{ matrix.platform }}" = "macos-latest" ]; then
            find src-tauri/target/${{ matrix.target }}/release/bundle/dmg -name "*.dmg" -exec mc cp {} minio/cekcok-releases/Cekcok-latest-macos.dmg \;
            find src-tauri/target/${{ matrix.target }}/release/bundle/macos -name "*.tar.gz*" -exec mc cp {} minio/cekcok-releases/ \;
          elif [ "${{ matrix.platform }}" = "windows-latest" ]; then
            find src-tauri/target/${{ matrix.target }}/release/bundle/msi -name "*.msi" -exec mc cp {} minio/cekcok-releases/Cekcok-latest-windows.msi \;
            find src-tauri/target/${{ matrix.target }}/release/bundle/nsis -name "*.exe" -exec mc cp {} minio/cekcok-releases/Cekcok-latest-windows.exe \;
            find src-tauri/target/${{ matrix.target }}/release/bundle/nsis -name "*.nsis.zip*" -exec mc cp {} minio/cekcok-releases/ \;
          fi
